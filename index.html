<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Laroche Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D2E22;
    --surface:#123727;
    --surface-2:#1A4433;
    --border:#2C5A44;
    --text:#F3EEDD;
    --muted:#9FBBA9;
    --gold:#C9A24E;
    --gold-soft:#E4CE93;
    --pending:#E0954A;
    --done:#5FAE95;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  body.lang-ar{font-family:'Tajawal','Inter',system-ui,sans-serif;}
  h1,h2,.serif{font-family:'Fraunces',serif;}
  body.lang-ar h1, body.lang-ar h2, body.lang-ar .serif{font-family:'Tajawal','Fraunces',serif;}

  #pattern{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.15;}

  /* ===== customer views ===== */
  .app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;padding:28px 20px 40px;display:flex;flex-direction:column;}

  .topbar{display:flex;justify-content:flex-end;margin-bottom:8px;}
  .lang-switch{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
  .lang-switch button{border:none;background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;letter-spacing:.02em;}
  .lang-switch button.active{background:var(--gold);color:#1a2b1f;}

  .brand{text-align:center;margin:18px 0 34px;}
  .medallion{width:78px;height:78px;margin:0 auto 14px;border-radius:50%;background:var(--bg);border:2px solid var(--gold);box-shadow:inset 0 0 0 4px var(--bg), inset 0 0 0 5px var(--gold-soft);display:flex;align-items:center;justify-content:center;}
  .medallion span{font-family:'Fraunces',serif;font-size:34px;color:var(--gold);font-weight:500;}
  .brand-name{font-size:26px;font-weight:500;margin:0 0 4px;letter-spacing:.01em;}
  .tagline{font-size:13px;color:var(--muted);margin:0;letter-spacing:.02em;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;}

  .heading{font-size:20px;font-weight:500;margin:0 0 6px;text-align:center;}
  .subtext{font-size:14px;color:var(--muted);text-align:center;margin:0 0 22px;line-height:1.5;}

  .table-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .table-grid a{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'Fraunces',serif;font-size:17px;text-decoration:none;transition:border-color .15s ease, background .15s ease;}
  .table-grid a:active{background:var(--gold);color:#1a2b1f;border-color:var(--gold);}

  .table-hero{text-align:center;margin:0 auto 18px;}
  .table-hero .table-label{font-size:13px;color:var(--gold-soft);letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px;}
  .table-hero .table-number-big{font-family:'Fraunces',serif;font-size:72px;line-height:1;color:var(--gold);font-weight:500;}

  .actions{display:flex;flex-direction:column;gap:12px;margin-top:20px;}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .1s ease, opacity .15s ease;}
  body.lang-ar .btn{font-family:'Tajawal',sans-serif;}
  .btn:active{transform:scale(0.98);}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#1a2b1f;}
  .btn.primary:disabled{background:var(--surface-2);border-color:var(--border);color:var(--muted);cursor:default;transform:none;}
  .btn svg{width:19px;height:19px;flex-shrink:0;}

  .confirm-line{text-align:center;font-size:12.5px;color:var(--done);margin-top:10px;min-height:16px;}

  .footer{margin-top:auto;padding-top:32px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.02em;}

  .back-link{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--muted);text-decoration:none;}

  /* subtle staff-entry button, bottom-left, low key on purpose */
  .staff-entry{
    position:fixed;left:14px;bottom:14px;z-index:5;
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(18,55,39,0.55);
    border:1px solid rgba(44,90,68,0.6);
    color:var(--muted);
    opacity:0.4;
    text-decoration:none;
    transition:opacity .15s ease;
  }
  [dir="rtl"] .staff-entry{left:auto;right:14px;}
  .staff-entry:hover, .staff-entry:focus{opacity:0.9;}
  .staff-entry svg{width:15px;height:15px;}

  /* ===== waiter views ===== */
  .waiter-app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:30px 22px 48px;}
  .header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px;}
  .brand-row{display:flex;align-items:center;gap:14px;}
  .medallion-sm{width:52px;height:52px;border-radius:50%;background:var(--bg);border:2px solid var(--gold);box-shadow:inset 0 0 0 3px var(--bg), inset 0 0 0 4px var(--gold-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .medallion-sm span{font-family:'Fraunces',serif;font-size:22px;color:var(--gold);}
  .titles h1{font-size:19px;margin:0 0 2px;font-weight:500;}
  .titles .subline{font-size:11.5px;letter-spacing:.12em;color:var(--muted);}
  .header-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .sound-btn{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;}
  .sound-btn.on{background:var(--done);border-color:var(--done);color:#0d2418;}
  .nav-link{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:9px 14px;border-radius:999px;}

  .section-title{display:flex;align-items:center;gap:10px;margin:8px 0 14px;}
  .section-title h2{font-size:18px;font-weight:500;margin:0;}
  .count-badge{background:var(--pending);color:#2b1804;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;}

  .call-row{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:10px;border-left:3px solid var(--pending);}
  [dir="rtl"] .call-row{border-left:none;border-right:3px solid var(--pending);}
  .call-left{display:flex;align-items:center;gap:16px;}
  .table-num{font-family:'Fraunces',serif;font-size:28px;color:var(--gold-soft);min-width:64px;}
  .call-meta .time{font-size:13.5px;color:var(--text);}
  .call-meta .elapsed{font-size:12px;color:var(--pending);margin-top:2px;}
  .resolve-btn{background:var(--surface-2);border:1px solid var(--gold);color:var(--gold-soft);padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .resolve-btn:hover{background:var(--gold);color:#1a2b1f;}

  .empty-state{text-align:center;padding:50px 20px;background:var(--surface);border:1px solid var(--border);border-radius:16px;}
  .empty-state .medallion-lg{width:74px;height:74px;margin:0 auto 18px;border-radius:50%;border:2px solid var(--border);opacity:.5;display:flex;align-items:center;justify-content:center;}
  .empty-state .medallion-lg span{font-family:'Fraunces',serif;font-size:30px;color:var(--muted);}
  .empty-state .main-line{font-size:16px;font-weight:500;margin:0 0 6px;}
  .empty-state .sub-line{font-size:13px;color:var(--muted);margin:0;}

  details{margin-top:26px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  summary{cursor:pointer;padding:15px 18px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;list-style:none;}
  summary::-webkit-details-marker{display:none;}
  summary .chev{transition:transform .15s ease;color:var(--muted);}
  details[open] summary .chev{transform:rotate(90deg);}
  .completed-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--border);font-size:13px;}
  .completed-row .table-num-sm{font-family:'Fraunces',serif;font-size:17px;color:var(--muted);}
  .completed-row .times{color:var(--muted);font-size:12px;text-align:right;}
  [dir="rtl"] .completed-row .times{text-align:left;}
  .completed-row .badge-done{color:var(--done);font-size:11.5px;font-weight:700;}

  .print-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px;}
  .print-toolbar input{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-size:13px;font-family:'Inter',sans-serif;}
  .print-btn{background:var(--gold);border:none;color:#1a2b1f;font-weight:700;padding:11px 20px;border-radius:10px;font-size:13.5px;cursor:pointer;}
  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .qr-card{background:#F3EEDD;border-radius:12px;padding:14px;text-align:center;color:#0D2E22;}
  .qr-card img{width:100%;height:auto;display:block;margin-bottom:8px;border-radius:4px;}
  .qr-card .num{font-family:'Fraunces',serif;font-size:16px;}

  @media print{
    body{background:#fff;}
    #pattern,.header,.print-toolbar,.nav-link,.staff-entry{display:none !important;}
    .qr-card{break-inside:avoid;border:1px solid #ccc;}
  }
</style>
</head>
<body>

<svg id="pattern" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="app"></div>

<script src="config.js"></script>
<script>
/* =============== shared: storage, i18n groundwork =============== */
const API_BASE = window.LAROCHE_API_BASE || '';

function localGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function localSet(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }

async function apiCreateCall(table_number){
  if(!API_BASE) return null;
  try{
    const res = await fetch(`${API_BASE}/api/calls`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ table_number })
    });
    return res.ok ? await res.json() : null;
  }catch(e){ console.error('apiCreateCall failed', e); return null; }
}
async function apiListCalls(){
  if(!API_BASE) return [];
  try{
    const res = await fetch(`${API_BASE}/api/calls`);
    return res.ok ? await res.json() : [];
  }catch(e){ console.error('apiListCalls failed', e); return []; }
}
async function apiResolveCall(id){
  if(!API_BASE) return null;
  try{
    const res = await fetch(`${API_BASE}/api/calls/${id}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ status:'done' })
    });
    return res.ok ? await res.json() : null;
  }catch(e){ console.error('apiResolveCall failed', e); return null; }
}

/* =============== icons =============== */
const ICON_BELL = `<svg viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const ICON_MENU = `<svg viewBox="0 0 24 24" fill="none"><path d="M7 3v6M5 3v6a2 2 0 002 2 2 2 0 002-2V3M17 3v18M17 3c-2.5 0-4 2-4 5s1.5 4 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON_INSTAGRAM = `<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></svg>`;
const ICON_STAFF = `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c0-3.6 3.2-6 7-6s7 2.4 7 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;

/* =============== decorative pattern =============== */
function buildPattern(){
  const svg = document.getElementById('pattern');
  const icons = [
    `<g><path d="M-8 4 L8 4 L6 26 Q7 30 0 30 Q-7 30 -6 26 Z" fill="none" stroke="#C9A24E" stroke-width="1.2"/><line x1="-9" y1="4" x2="9" y2="4" stroke="#C9A24E" stroke-width="1.2"/><line x1="3" y1="-6" x2="7" y2="4" stroke="#C9A24E" stroke-width="1.2"/><circle cx="3" cy="-8" r="1.4" fill="#C9A24E"/></g>`,
    `<g><circle cx="0" cy="0" r="12" fill="none" stroke="#C9A24E" stroke-width="1.2"/><circle cx="-4" cy="-3" r="1.3" fill="#C9A24E"/><circle cx="4" cy="-4" r="1.3" fill="#C9A24E"/><circle cx="1" cy="4" r="1.3" fill="#C9A24E"/><circle cx="-5" cy="4" r="1.3" fill="#C9A24E"/></g>`,
    `<g><ellipse cx="0" cy="14" rx="9" ry="12" fill="none" stroke="#C9A24E" stroke-width="1.2"/><rect x="-2.5" y="-8" width="5" height="16" fill="none" stroke="#C9A24E" stroke-width="1.1"/><path d="M-2.5 -8 Q -14 -10 -14 2" fill="none" stroke="#C9A24E" stroke-width="1.1"/><circle cx="0" cy="-11" r="3" fill="none" stroke="#C9A24E" stroke-width="1.1"/></g>`
  ];
  let defs = `<defs><pattern id="tile" width="140" height="140" patternUnits="userSpaceOnUse">`;
  const positions = [[24,30],[95,20],[60,90],[110,110],[20,115]];
  positions.forEach((p,i)=>{ defs += `<g transform="translate(${p[0]},${p[1]}) scale(1.1)">${icons[i%icons.length]}</g>`; });
  defs += `</pattern></defs>`;
  svg.innerHTML = defs + `<rect width="100%" height="100%" fill="url(#tile)"/>`;
}
buildPattern();

/* =============== customer i18n =============== */
const CUST_DICT = {
  tr:{ pickHeading:"Masanızı seçin", pickSub:"Devam etmek için masa numaranıza dokunun",
    welcomeHeading:"Hoş geldiniz", welcomeSub:"Size nasıl yardımcı olabiliriz?", table:"Masa",
    menu:"Menüyü Görüntüle", instagram:"Instagram'da Takip Et", call:"Garson Çağır", called:"Çağrıldı ✓",
    calledLine:(t)=>`Garson çağrıldı — ${t}'de bildirildi`, footer:(n)=>`Laroche Cafe · Masa ${n}`,
    back:"← Masaları göster", tagline:"Lüks Lounge & Cafe" },
  ar:{ pickHeading:"اختر طاولتك", pickSub:"اضغط على رقم طاولتك للمتابعة",
    welcomeHeading:"أهلاً بكم", welcomeSub:"كيف يمكننا خدمتكم؟", table:"طاولة",
    menu:"عرض القائمة", instagram:"تابعنا على إنستغرام", call:"استدعاء النادل", called:"تم الاستدعاء ✓",
    calledLine:(t)=>`تم استدعاء النادل — الساعة ${t}`, footer:(n)=>`لاروش كافيه · طاولة ${n}`,
    back:"← عرض الطاولات", tagline:"لاونج وكافيه فاخر" },
  en:{ pickHeading:"Select your table", pickSub:"Tap your table number to continue",
    welcomeHeading:"Welcome", welcomeSub:"How can we help you today?", table:"Table",
    menu:"View Menu", instagram:"Follow on Instagram", call:"Call Waiter", called:"Called ✓",
    calledLine:(t)=>`Waiter called — notified at ${t}`, footer:(n)=>`Laroche Cafe · Table ${n}`,
    back:"← Back to tables", tagline:"Luxury Lounge & Cafe" }
};
let custLang = 'tr';
const CUST_LANG_KEY = 'laroche-customer-lang';
function ct(key, ...args){ const v = CUST_DICT[custLang][key]; return typeof v==='function' ? v(...args) : v; }

function applyDirLang(lang){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('lang-ar', lang === 'ar');
}

function custLangSwitchHTML(){
  const langs = [['tr','TR'],['ar','AR'],['en','EN']];
  return `<div class="lang-switch">${langs.map(([code,label])=>
    `<button data-lang="${code}" class="${code===custLang?'active':''}">${label}</button>`).join('')}</div>`;
}
function bindCustLangSwitch(render){
  document.querySelectorAll('.lang-switch button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      custLang = btn.dataset.lang;
      localSet(CUST_LANG_KEY, custLang);
      applyDirLang(custLang);
      render();
    });
  });
}

function staffEntryHTML(){
  return `<a class="staff-entry" href="#/waiter" aria-label="Staff" title="Staff">${ICON_STAFF}</a>`;
}

/* =============== customer: table picker =============== */
function renderPicker(){
  applyDirLang(custLang);
  const app = document.getElementById('app');
  let grid = '';
  for(let i=1;i<=25;i++){ grid += `<a href="#/table/${i}">${i}</a>`; }
  app.innerHTML = `
    <div class="app">
      <div class="topbar">${custLangSwitchHTML()}</div>
      <div class="brand">
        <div class="medallion"><span>L</span></div>
        <h1 class="brand-name">Laroche Cafe</h1>
        <p class="tagline">${ct('tagline')}</p>
      </div>
      <div class="card">
        <h2 class="heading">${ct('pickHeading')}</h2>
        <p class="subtext">${ct('pickSub')}</p>
        <div class="table-grid">${grid}</div>
      </div>
      <div class="footer">Laroche Cafe · 2014</div>
    </div>
    ${staffEntryHTML()}
  `;
  bindCustLangSwitch(renderPicker);
}

/* =============== customer: per-table page =============== */
async function renderTable(n){
  applyDirLang(custLang);
  const app = document.getElementById('app');
  const cooldownKey = `cooldown-table-${n}`;
  const lastCallAt = localGet(cooldownKey);
  const now = Date.now();
  const cooldownMs = 30000;
  let remaining = 0;
  if(lastCallAt){
    const elapsed = now - Number(lastCallAt);
    if(elapsed < cooldownMs) remaining = cooldownMs - elapsed;
  }

  app.innerHTML = `
    <div class="app">
      <div class="topbar">${custLangSwitchHTML()}</div>
      <a class="back-link" href="#/">${ct('back')}</a>
      <div class="brand" style="margin-top:0;">
        <div class="medallion"><span>L</span></div>
        <h1 class="brand-name">Laroche Cafe</h1>
        <p class="tagline">${ct('tagline')}</p>
      </div>
      <div class="table-hero">
        <div class="table-label">${ct('table')}</div>
        <div class="table-number-big">${n}</div>
      </div>
      <div class="card">
        <h2 class="heading">${ct('welcomeHeading')}</h2>
        <p class="subtext">${ct('welcomeSub')}</p>
        <div class="actions">
          <a class="btn" href="https://owlmenu.net/laroche/" target="_blank" rel="noopener">${ICON_MENU}<span>${ct('menu')}</span></a>
          <a class="btn" href="https://www.instagram.com/laroche.cafe/" target="_blank" rel="noopener">${ICON_INSTAGRAM}<span>${ct('instagram')}</span></a>
          <button class="btn primary" id="callBtn">${ICON_BELL}<span id="callLabel"></span></button>
        </div>
        <p class="confirm-line" id="confirmLine"></p>
      </div>
      <div class="footer">${ct('footer', n)}</div>
    </div>
    ${staffEntryHTML()}
  `;
  bindCustLangSwitch(()=>renderTable(n));

  const callBtn = document.getElementById('callBtn');
  const callLabel = document.getElementById('callLabel');
  const confirmLine = document.getElementById('confirmLine');
  let timerId = null;

  function fmtTime(ms){
    return new Date(ms).toLocaleTimeString(custLang==='ar'?'ar':custLang==='tr'?'tr-TR':'en-GB', {hour:'2-digit',minute:'2-digit'});
  }
  function setDisabled(msRemaining, calledAtMs){
    callBtn.disabled = true;
    callLabel.textContent = ct('called');
    if(calledAtMs) confirmLine.textContent = ct('calledLine', fmtTime(calledAtMs));
    let left = msRemaining;
    clearInterval(timerId);
    timerId = setInterval(()=>{
      left -= 1000;
      if(left <= 0){
        clearInterval(timerId);
        callBtn.disabled = false;
        callLabel.textContent = ct('call');
      }
    }, 1000);
  }

  if(remaining > 0){ setDisabled(remaining, Number(lastCallAt)); }
  else{ callLabel.textContent = ct('call'); }

  callBtn.addEventListener('click', async ()=>{
    if(callBtn.disabled) return;
    const callTime = Date.now();
    localSet(cooldownKey, String(callTime));
    const created = await apiCreateCall(n);
    const effectiveTime = created ? created.called_at : callTime;
    setDisabled(cooldownMs, effectiveTime);
  });
}

/* =============== waiter i18n =============== */
const WAIT_DICT = {
  tr:{ dashTitle:"Garson Paneli", brandLine:"LAROCHE CAFE", enableSound:"Sesi Etkinleştir", soundOn:"Ses açık ✓",
    pending:"Bekleyen Çağrılar", noPending:"Bekleyen çağrı yok", noPendingSub:"Yeni çağrılar burada anında görünecek",
    completed:"Tamamlanan Çağrılar", resolve:"Tamamlandı", called:"çağrıldı", agoSuffix:"önce", justNow:"az önce",
    print:"Yazdırma Sayfası", backToDash:"← Panele dön", backToCustomer:"← Müşteri uygulamasına dön",
    printTitle:"Masa QR Kodları", customerUrlLabel:"Müşteri uygulaması adresi", printBtn:"Yazdır", table:"Masa",
    voiceTablePrefix:"Masa" },
  ar:{ dashTitle:"لوحة النادل", brandLine:"لاروش كافيه", enableSound:"تفعيل الصوت", soundOn:"الصوت مفعّل ✓",
    pending:"الطلبات المعلّقة", noPending:"لا توجد طلبات معلّقة", noPendingSub:"ستظهر الطلبات الجديدة هنا فوراً",
    completed:"الطلبات المكتملة", resolve:"تم الحل", called:"تم الاستدعاء", agoSuffix:"مضت", justNow:"الآن",
    print:"صفحة الطباعة", backToDash:"← العودة للوحة", backToCustomer:"← رجوع لتطبيق العملاء",
    printTitle:"رموز QR للطاولات", customerUrlLabel:"رابط تطبيق العملاء", printBtn:"طباعة", table:"طاولة",
    voiceTablePrefix:"طاولة" },
  en:{ dashTitle:"Waiter Dashboard", brandLine:"LAROCHE CAFE", enableSound:"Enable Sound", soundOn:"Sound on ✓",
    pending:"Pending Calls", noPending:"No pending calls", noPendingSub:"New calls will appear here instantly.",
    completed:"Completed calls", resolve:"Resolved", called:"called", agoSuffix:"ago", justNow:"just now",
    print:"Print Page", backToDash:"← Back to dashboard", backToCustomer:"← Back to customer app",
    printTitle:"Table QR Codes", customerUrlLabel:"Customer app URL", printBtn:"Print", table:"Table",
    voiceTablePrefix:"Table" }
};
const VOICE_LOCALE = { tr:'tr-TR', ar:'ar-SA', en:'en-GB' };
let waitLang = 'tr';
const WAIT_LANG_KEY = 'laroche-waiter-lang';
function wt(key){ return WAIT_DICT[waitLang][key]; }

/* audio + voice */
let soundEnabled = false;
let audioCtx = null;
function playChime(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  [[880, now], [1175, now + 0.16]].forEach(([freq, start])=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.22, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start); osc.stop(start + 0.4);
  });
}
function speakTable(n){
  if(!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(`${wt('voiceTablePrefix')} ${n}`);
  utter.lang = VOICE_LOCALE[waitLang];
  const voices = speechSynthesis.getVoices();
  const match = voices.find(v=>v.lang===VOICE_LOCALE[waitLang]) || voices.find(v=>v.lang && v.lang.startsWith(waitLang));
  if(match) utter.voice = match;
  speechSynthesis.speak(utter);
}
function alertNewCall(n){
  if(!soundEnabled) return;
  playChime();
  setTimeout(()=>speakTable(n), 500);
}

function waitHeaderHTML(activeView){
  const langs = [['tr','TR'],['ar','AR'],['en','EN']];
  return `
    <div class="header">
      <div class="brand-row">
        <div class="medallion-sm"><span>L</span></div>
        <div class="titles"><h1>${wt('dashTitle')}</h1><div class="subline">${wt('brandLine')}</div></div>
      </div>
      <div class="header-controls">
        ${activeView === 'dashboard' ? `
          <button class="sound-btn ${soundEnabled?'on':''}" id="soundBtn">${soundEnabled?'🔊':'🔈'} <span>${soundEnabled?wt('soundOn'):wt('enableSound')}</span></button>
          <a class="nav-link" href="#/admin-print">${wt('print')}</a>
        ` : `<a class="nav-link" href="#/waiter">${wt('backToDash')}</a>`}
        <a class="nav-link" href="#/">${wt('backToCustomer')}</a>
        <div class="lang-switch">${langs.map(([code,label])=>
          `<button data-lang="${code}" class="${code===waitLang?'active':''}">${label}</button>`).join('')}</div>
      </div>
    </div>
  `;
}
function bindWaitHeader(render){
  document.querySelectorAll('.lang-switch button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      waitLang = btn.dataset.lang;
      localSet(WAIT_LANG_KEY, waitLang);
      applyDirLang(waitLang);
      render();
    });
  });
  const soundBtn = document.getElementById('soundBtn');
  if(soundBtn){
    soundBtn.addEventListener('click', ()=>{
      if(!soundEnabled){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        playChime();
        soundEnabled = true;
        render();
      }
    });
  }
}

function fmtClock(ms){
  return new Date(ms).toLocaleTimeString(waitLang==='ar'?'ar':waitLang==='tr'?'tr-TR':'en-GB', {hour:'2-digit',minute:'2-digit'});
}
function fmtElapsed(ms){
  const diff = Math.max(0, Date.now() - ms);
  const mins = Math.floor(diff / 60000);
  if(mins < 1) return wt('justNow');
  return `${mins}m ${wt('agoSuffix')}`;
}

const seenIds = new Set();
let seenInitialized = false;
let pollTimer = null;

async function renderDashboard(){
  applyDirLang(waitLang);
  const app = document.getElementById('app');
  const calls = await apiListCalls();

  if(!seenInitialized){
    calls.filter(c=>c.status==='pending').forEach(c=>seenIds.add(c.id));
    seenInitialized = true;
  } else {
    calls.filter(c=>c.status==='pending' && !seenIds.has(c.id)).forEach(c=>{
      seenIds.add(c.id);
      alertNewCall(c.table_number);
    });
  }

  const pending = calls.filter(c=>c.status==='pending').sort((a,b)=>b.called_at - a.called_at);
  const completed = calls.filter(c=>c.status==='done').sort((a,b)=>(b.resolved_at||0)-(a.resolved_at||0)).slice(0,8);

  const pendingHTML = pending.length ? pending.map(c => `
    <div class="call-row" data-id="${c.id}">
      <div class="call-left">
        <div class="table-num">${c.table_number}</div>
        <div class="call-meta">
          <div class="time">${wt('called')} ${fmtClock(c.called_at)}</div>
          <div class="elapsed">${fmtElapsed(c.called_at)}</div>
        </div>
      </div>
      <button class="resolve-btn" data-resolve="${c.id}">${wt('resolve')}</button>
    </div>
  `).join('') : `
    <div class="empty-state">
      <div class="medallion-lg"><span>L</span></div>
      <p class="main-line">${wt('noPending')}</p>
      <p class="sub-line">${wt('noPendingSub')}</p>
    </div>
  `;

  const completedHTML = completed.length ? completed.map(c => `
    <div class="completed-row">
      <div class="table-num-sm">${wt('table')} ${c.table_number}</div>
      <div class="times">
        <div>${fmtClock(c.called_at)} → ${c.resolved_at ? fmtClock(c.resolved_at) : '—'}</div>
        <div class="badge-done">${wt('resolve')}</div>
      </div>
    </div>
  `).join('') : `<div class="completed-row"><span style="color:var(--muted);font-size:13px;">—</span></div>`;

  app.innerHTML = `
    <div class="waiter-app">
      ${waitHeaderHTML('dashboard')}
      <div class="section-title"><h2>${wt('pending')}</h2><span class="count-badge">${pending.length}</span></div>
      <div id="pendingList">${pendingHTML}</div>
      <details><summary>${wt('completed')} <span class="chev">›</span></summary>${completedHTML}</details>
    </div>
  `;

  bindWaitHeader(renderDashboard);
  document.querySelectorAll('[data-resolve]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      await apiResolveCall(Number(btn.dataset.resolve));
      renderDashboard();
    });
  });
}

function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(()=>{
    if(parseRoute().view === 'waiter') renderDashboard();
  }, 3000);
}

const CUSTOMER_URL_KEY = 'laroche-customer-app-url';
async function renderPrint(){
  applyDirLang(waitLang);
  clearInterval(pollTimer);
  const app = document.getElementById('app');
  const savedUrl = localGet(CUSTOMER_URL_KEY) || (location.origin + location.pathname);

  app.innerHTML = `
    <div class="waiter-app">
      ${waitHeaderHTML('print')}
      <h2 class="serif" style="font-size:20px;font-weight:500;margin:0 0 16px;">${wt('printTitle')}</h2>
      <div class="print-toolbar">
        <input id="customerUrl" type="text" placeholder="${wt('customerUrlLabel')} (https://...)" value="${savedUrl}">
        <button class="print-btn" id="printBtn">${wt('printBtn')}</button>
      </div>
      <div class="qr-grid" id="qrGrid"></div>
    </div>
  `;
  bindWaitHeader(renderPrint);

  const input = document.getElementById('customerUrl');
  const grid = document.getElementById('qrGrid');
  function draw(){
    let base = input.value.trim().replace(/\/$/, '');
    grid.innerHTML = '';
    for(let n=1;n<=25;n++){
      const target = base ? `${base}#/table/${n}` : '';
      const qrSrc = base ? `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=6&data=${encodeURIComponent(target)}` : '';
      const card = document.createElement('div');
      card.className = 'qr-card';
      card.innerHTML = base
        ? `<img src="${qrSrc}" alt="Table ${n} QR"><div class="num">${wt('table')} ${n}</div>`
        : `<div style="height:150px;display:flex;align-items:center;justify-content:center;color:#8a7a55;font-size:12px;">${wt('customerUrlLabel')}</div><div class="num">${wt('table')} ${n}</div>`;
      grid.appendChild(card);
    }
  }
  draw();
  input.addEventListener('input', ()=>{ localSet(CUSTOMER_URL_KEY, input.value.trim()); draw(); });
  document.getElementById('printBtn').addEventListener('click', ()=>window.print());
}

/* =============== routing =============== */
function parseRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  if(h === 'waiter') return { view:'waiter' };
  if(h === 'admin-print') return { view:'print' };
  const m = h.match(/^table\/(\d{1,2})$/);
  if(m){
    const n = parseInt(m[1], 10);
    if(n >= 1 && n <= 25) return { view:'table', n };
  }
  return { view:'picker' };
}

async function render(){
  clearInterval(pollTimer);
  const route = parseRoute();
  if(route.view === 'waiter'){ await renderDashboard(); startPolling(); }
  else if(route.view === 'print'){ await renderPrint(); }
  else if(route.view === 'table'){ await renderTable(route.n); }
  else{ renderPicker(); }
}

(async function init(){
  const savedCustLang = localGet(CUST_LANG_KEY);
  if(savedCustLang && CUST_DICT[savedCustLang]) custLang = savedCustLang;
  const savedWaitLang = localGet(WAIT_LANG_KEY);
  if(savedWaitLang && WAIT_DICT[savedWaitLang]) waitLang = savedWaitLang;
  if('speechSynthesis' in window) speechSynthesis.getVoices();
  await render();
})();

window.addEventListener('hashchange', render);
</script>
